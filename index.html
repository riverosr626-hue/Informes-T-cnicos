<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informes Técnicos</title>
  <meta name="description" content="Sube, organiza y consulta tus informes técnicos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;

      --paper: #f1f4f7;
      --surface: #ffffff;
      --ink: #16232f;
      --muted: #566675;
      --line: #d3dae2;
      --accent: #17527f;
      --accent-ink: #ffffff;
      --danger: #a8321f;

      --c-inspeccion: #17527f;
      --c-ensayo: #2e7d5b;
      --c-laboratorio: #7a4fa0;
      --c-estudio: #b5651d;
      --c-avance: #3c7f8c;
      --c-peritaje: #a8321f;
      --c-otro: #6b7782;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12181e;
        --surface: #1a222a;
        --ink: #e6ecf1;
        --muted: #93a3b2;
        --line: #2c3843;
        --accent: #6db0e3;
        --accent-ink: #0b1722;
        --danger: #f08a77;

        --c-inspeccion: #6db0e3;
        --c-ensayo: #6cc79d;
        --c-laboratorio: #b895dd;
        --c-estudio: #e3a066;
        --c-avance: #75c3d1;
        --c-peritaje: #f08a77;
        --c-otro: #9aa7b3;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(16px, 3vw, 40px);
    }

    .top {
      margin-bottom: 28px;
    }

    .top h1 {
      margin: 0;
      font: 600 clamp(1.8rem, 3.2vw, 2.5rem)/1.15 "IBM Plex Serif", Georgia, serif;
      letter-spacing: -0.01em;
    }

    .top p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    h2 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .fatal {
      margin: 0 0 20px;
      padding: 12px 14px;
      border: 1px solid var(--danger);
      border-radius: 4px;
      color: var(--danger);
      background: var(--surface);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* Formulario */

    .upload {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
    }

    @media (min-width: 861px) {
      .upload {
        position: sticky;
        top: 16px;
      }
    }

    .upload h2 {
      margin-bottom: 16px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .drop {
      display: block;
      margin-bottom: 18px;
      padding: 18px 16px;
      border: 1.5px dashed var(--line);
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    .drop:hover,
    .drop.is-over {
      border-color: var(--accent);
    }

    .drop:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .drop-main {
      display: block;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .drop-hint {
      display: block;
      margin-top: 2px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .req {
      font-weight: 400;
      color: var(--muted);
    }

    input[type="text"],
    input[type="search"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.55rem 0.65rem;
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    textarea {
      resize: vertical;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    .btn:focus-visible,
    .report-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Botones */

    .btn {
      padding: 0.6rem 1rem;
      font: 500 1rem/1.2 inherit;
      font-family: inherit;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }

    .btn.danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    .msg {
      min-height: 1.5em;
      margin: 12px 0 0;
      font-size: 0.9375rem;
    }

    .msg.error {
      color: var(--danger);
    }

    /* Biblioteca */

    .library-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .count {
      color: var(--muted);
      font-size: 0.9375rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0 12px;
      margin-bottom: 6px;
    }

    .filters .field {
      flex: 0 1 200px;
    }

    .filters .grow {
      flex: 1 1 240px;
    }

    .list {
      display: grid;
      gap: 8px;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .report {
      --t: var(--c-otro);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 6px solid var(--t);
      border-radius: 4px;
    }

    .report[data-type="inspeccion"] { --t: var(--c-inspeccion); }
    .report[data-type="ensayo"] { --t: var(--c-ensayo); }
    .report[data-type="laboratorio"] { --t: var(--c-laboratorio); }
    .report[data-type="estudio"] { --t: var(--c-estudio); }
    .report[data-type="avance"] { --t: var(--c-avance); }
    .report[data-type="peritaje"] { --t: var(--c-peritaje); }
    .report[data-type="otro"] { --t: var(--c-otro); }

    .report-btn {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 16px;
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: inherit;
      text-align: left;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .report-btn:hover {
      background: color-mix(in srgb, var(--t) 7%, transparent);
    }

    .r-title {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .r-side {
      grid-column: 2;
      grid-row: 1 / span 3;
      text-align: right;
      font-size: 0.875rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .r-side span {
      display: block;
    }

    .r-type {
      color: var(--t);
      font-weight: 500;
    }

    .r-sub {
      font-size: 0.9375rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .r-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tag {
      padding: 1px 8px;
      font-size: 0.8125rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .empty {
      margin: 24px 0 0;
      color: var(--muted);
    }

    .storage-note {
      margin: 24px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Detalle */

    dialog {
      width: calc(100% - 32px);
      max-width: 560px;
      padding: 0;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 0.55);
    }

    .detail-body {
      padding: 22px;
    }

    .detail-body h2 {
      margin-bottom: 14px;
      font-size: 1.25rem;
      overflow-wrap: anywhere;
    }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 8px 16px;
      margin: 0 0 22px;
    }

    dt {
      color: var(--muted);
      font-size: 0.9375rem;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-actions .push {
      margin-left: auto;
    }

    @media (max-width: 420px) {
      .report-btn {
        grid-template-columns: minmax(0, 1fr);
      }

      .r-side {
        grid-column: 1;
        grid-row: auto;
        text-align: left;
        margin-top: 4px;
      }

      .r-side span {
        display: inline;
        margin-right: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Informes Técnicos</h1>
      <p>Sube, organiza y consulta tus informes</p>
    </header>

    <p id="fatal" class="fatal" role="alert" hidden></p>

    <div class="layout">
      <section class="upload" aria-labelledby="upload-title">
        <h2 id="upload-title">Subir informe</h2>

        <form id="form" novalidate>
          <label class="drop" id="drop">
            <input type="file" id="file" class="visually-hidden">
            <span class="drop-main" id="drop-main">Arrastra un archivo aquí o haz clic para seleccionarlo</span>
            <span class="drop-hint" id="drop-hint">PDF, Word, Excel, imágenes, ZIP… (máx. 50 MB)</span>
          </label>

          <div class="field">
            <label for="title">Título <span class="req">(obligatorio)</span></label>
            <input type="text" id="title" maxlength="200" autocomplete="off">
          </div>

          <div class="field">
            <label for="author">Autor / Responsable</label>
            <input type="text" id="author" maxlength="120" autocomplete="name">
          </div>

          <div class="field">
            <label for="project">Proyecto</label>
            <input type="text" id="project" maxlength="120" list="project-options" autocomplete="off">
            <datalist id="project-options"></datalist>
          </div>

          <div class="field">
            <label for="type">Tipo de informe</label>
            <select id="type"></select>
          </div>

          <div class="field">
            <label for="date">Fecha del informe</label>
            <input type="date" id="date">
          </div>

          <div class="field">
            <label for="tags">Etiquetas (separadas por coma)</label>
            <input type="text" id="tags" maxlength="300" autocomplete="off">
          </div>

          <div class="field">
            <label for="notes">Notas</label>
            <textarea id="notes" rows="3" maxlength="2000"></textarea>
          </div>

          <button type="submit" class="btn primary" id="save">Guardar informe</button>
          <p id="form-msg" class="msg" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="library-head">
          <h2 id="library-title">Informes guardados</h2>
          <span id="count" class="count"></span>
        </div>

        <div class="filters">
          <div class="field grow">
            <label for="search">Buscar</label>
            <input type="search" id="search" placeholder="Título, autor, etiqueta, nota…" autocomplete="off">
          </div>
          <div class="field">
            <label for="filter-type">Tipo</label>
            <select id="filter-type"></select>
          </div>
          <div class="field">
            <label for="filter-project">Proyecto</label>
            <select id="filter-project"></select>
          </div>
        </div>

        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden></p>

        <p class="storage-note">Los informes se guardan solo en este navegador y en este dispositivo.</p>
      </section>
    </div>
  </div>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-body">
      <h2 id="detail-title"></h2>
      <dl id="detail-fields"></dl>
      <div class="detail-actions">
        <button type="button" class="btn primary" id="d-open">Abrir</button>
        <button type="button" class="btn secondary" id="d-download">Descargar</button>
        <button type="button" class="btn danger" id="d-delete">Eliminar</button>
        <button type="button" class="btn secondary push" id="d-close">Cerrar</button>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';

    /* ---------- Configuración ---------- */

    const TYPES = [
      { value: 'inspeccion', label: 'Informe de inspección' },
      { value: 'ensayo', label: 'Informe de ensayo' },
      { value: 'laboratorio', label: 'Informe de laboratorio' },
      { value: 'estudio', label: 'Estudio técnico' },
      { value: 'avance', label: 'Informe de avance' },
      { value: 'peritaje', label: 'Peritaje' },
      { value: 'otro', label: 'Otro' },
    ];
    const TYPE_LABEL = Object.fromEntries(TYPES.map((t) => [t.value, t.label]));

    const MAX_BYTES = 50 * 1024 * 1024;
    const DROP_MAIN_DEFAULT = 'Arrastra un archivo aquí o haz clic para seleccionarlo';

    /* ---------- Utilidades ---------- */

    const $ = (id) => document.getElementById(id);

    function el(tag, attrs = {}, ...kids) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else node.setAttribute(k, v);
      }
      node.append(...kids);
      return node;
    }

    function norm(s) {
      return String(s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function todayISO() {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    const dateFmt = new Intl.DateTimeFormat('es-CL', { dateStyle: 'medium', timeZone: 'UTC' });
    function fmtDate(iso) {
      const d = new Date(iso + 'T00:00:00Z');
      return Number.isNaN(d.getTime()) ? iso : dateFmt.format(d);
    }

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function parseTags(text) {
      const seen = new Set();
      const tags = [];
      for (const raw of text.split(',')) {
        const t = raw.trim();
        const key = norm(t);
        if (t && !seen.has(key)) {
          seen.add(key);
          tags.push(t);
        }
      }
      return tags.slice(0, 12);
    }

    /* ---------- Almacenamiento (IndexedDB) ---------- */

    const DB_NAME = 'informes-tecnicos';
    const DB_VERSION = 1;
    let db;

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('indexedDB no disponible'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const d = req.result;
          d.createObjectStore('reports', { keyPath: 'id' });
          d.createObjectStore('files');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function runTx(stores, mode, work) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, mode);
        let result;
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
        const out = work(tx);
        if (out) {
          out.onsuccess = () => {
            result = out.result;
          };
        }
      });
    }

    const dbGetAllReports = () => runTx(['reports'], 'readonly', (tx) => tx.objectStore('reports').getAll());
    const dbGetFile = (id) => runTx(['files'], 'readonly', (tx) => tx.objectStore('files').get(id));

    function dbSave(meta, file) {
      return runTx(['reports', 'files'], 'readwrite', (tx) => {
        tx.objectStore('reports').put(meta);
        tx.objectStore('files').put(file, meta.id);
      });
    }

    function dbDelete(id) {
      return runTx(['reports', 'files'], 'readwrite', (tx) => {
        tx.objectStore('reports').delete(id);
        tx.objectStore('files').delete(id);
      });
    }

    /* ---------- Estado ---------- */

    let reports = [];
    let currentId = null;

    /* ---------- Elementos ---------- */

    const form = $('form');
    const fileInput = $('file');
    const drop = $('drop');
    const dropMain = $('drop-main');
    const titleInput = $('title');
    const authorInput = $('author');
    const projectInput = $('project');
    const projectOptions = $('project-options');
    const typeSelect = $('type');
    const dateInput = $('date');
    const tagsInput = $('tags');
    const notesInput = $('notes');
    const saveBtn = $('save');
    const formMsg = $('form-msg');

    const searchInput = $('search');
    const filterType = $('filter-type');
    const filterProject = $('filter-project');
    const list = $('list');
    const empty = $('empty');
    const count = $('count');

    const detail = $('detail');

    /* ---------- Formulario ---------- */

    function say(text, isError = false) {
      formMsg.textContent = text;
      formMsg.classList.toggle('error', isError);
    }

    function resetDrop() {
      dropMain.textContent = DROP_MAIN_DEFAULT;
    }

    function handleFile() {
      const file = fileInput.files[0];
      if (!file) {
        resetDrop();
        return;
      }
      if (file.size > MAX_BYTES) {
        fileInput.value = '';
        resetDrop();
        say('El archivo pesa ' + fmtSize(file.size) + ' y el máximo es 50 MB.', true);
        return;
      }
      say('');
      dropMain.textContent = file.name + ' (' + fmtSize(file.size) + ')';
      if (!titleInput.value.trim()) {
        titleInput.value = file.name.replace(/\.[^.]+$/, '');
      }
    }

    fileInput.addEventListener('change', handleFile);

    ['dragenter', 'dragover'].forEach((ev) =>
      drop.addEventListener(ev, (e) => {
        e.preventDefault();
        drop.classList.add('is-over');
      })
    );
    ['dragleave', 'dragend'].forEach((ev) =>
      drop.addEventListener(ev, () => drop.classList.remove('is-over'))
    );
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('is-over');
      if (e.dataTransfer && e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFile();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) {
        say('Selecciona un archivo para guardar el informe.', true);
        return;
      }
      if (file.size > MAX_BYTES) {
        say('El archivo supera el máximo de 50 MB.', true);
        return;
      }
      const title = titleInput.value.trim();
      if (!title) {
        say('Escribe un título para el informe.', true);
        titleInput.focus();
        return;
      }

      const meta = {
        id: newId(),
        title,
        author: authorInput.value.trim(),
        project: projectInput.value.trim(),
        type: typeSelect.value,
        date: dateInput.value || todayISO(),
        tags: parseTags(tagsInput.value),
        notes: notesInput.value.trim(),
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileSize: file.size,
        createdAt: Date.now(),
      };

      saveBtn.disabled = true;
      say('Guardando…');
      try {
        await dbSave(meta, file);
        reports.push(meta);
        form.reset();
        dateInput.value = todayISO();
        resetDrop();
        refreshProjects();
        render();
        say('Informe guardado.');
      } catch (err) {
        console.error(err);
        if (err && err.name === 'QuotaExceededError') {
          say('No hay espacio suficiente en el navegador. Elimina informes antiguos o libera espacio.', true);
        } else {
          say('No se pudo guardar el informe. Inténtalo de nuevo.', true);
        }
      } finally {
        saveBtn.disabled = false;
      }
    });

    /* ---------- Proyectos y filtros ---------- */

    function projectNames() {
      return [...new Set(reports.map((r) => r.project).filter(Boolean))].sort((a, b) =>
        a.localeCompare(b, 'es')
      );
    }

    function refreshProjects() {
      const names = projectNames();

      projectOptions.replaceChildren(...names.map((n) => el('option', { value: n })));

      const previous = filterProject.value;
      filterProject.replaceChildren(
        el('option', { value: '' }, 'Todos los proyectos'),
        ...names.map((n) => el('option', { value: n }, n))
      );
      filterProject.value = names.includes(previous) ? previous : '';
    }

    function fillTypeSelects() {
      typeSelect.replaceChildren(...TYPES.map((t) => el('option', { value: t.value }, t.label)));
      filterType.replaceChildren(
        el('option', { value: '' }, 'Todos los tipos'),
        ...TYPES.map((t) => el('option', { value: t.value }, t.label))
      );
    }

    [searchInput, filterType, filterProject].forEach((c) => c.addEventListener('input', render));

    /* ---------- Lista ---------- */

    function haystack(r) {
      return norm([r.title, r.author, r.project, r.notes, r.fileName, TYPE_LABEL[r.type], r.tags.join(' ')].join(' '));
    }

    function rowFor(r) {
      const sub = [r.project, r.author].filter(Boolean).join('  /  ');

      const main = [el('span', { class: 'r-title' }, r.title)];
      if (sub) main.push(el('span', { class: 'r-sub' }, sub));
      if (r.tags.length) {
        main.push(el('span', { class: 'r-tags' }, ...r.tags.map((t) => el('span', { class: 'tag' }, t))));
      }

      const side = el(
        'span',
        { class: 'r-side' },
        el('span', { class: 'r-type' }, TYPE_LABEL[r.type] || 'Otro'),
        el('span', {}, fmtDate(r.date)),
        el('span', {}, fmtSize(r.fileSize))
      );

      const btn = el('button', { type: 'button', class: 'report-btn' }, ...main, side);
      btn.addEventListener('click', () => openDetail(r.id));

      const li = el('li', { class: 'report', 'data-type': TYPE_LABEL[r.type] ? r.type : 'otro' }, btn);
      return li;
    }

    function render() {
      const q = norm(searchInput.value.trim());
      const t = filterType.value;
      const p = filterProject.value;

      const items = reports
        .filter((r) => (!t || r.type === t) && (!p || r.project === p) && (!q || haystack(r).includes(q)))
        .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

      list.replaceChildren(...items.map(rowFor));

      const total = reports.length;
      count.textContent =
        total === 0
          ? ''
          : items.length === total
            ? total + (total === 1 ? ' informe' : ' informes')
            : items.length + ' de ' + total;

      if (items.length === 0) {
        empty.hidden = false;
        empty.textContent =
          total === 0
            ? 'Aún no hay informes. Sube el primero con el formulario.'
            : 'Ningún informe coincide con la búsqueda o los filtros.';
      } else {
        empty.hidden = true;
      }
    }

    /* ---------- Detalle ---------- */

    function previewable(type) {
      return /^(application\/pdf|image\/|text\/)/.test(type);
    }

    function openDetail(id) {
      const r = reports.find((x) => x.id === id);
      if (!r) return;
      currentId = id;

      $('detail-title').textContent = r.title;

      const rows = [
        ['Tipo', TYPE_LABEL[r.type] || 'Otro'],
        ['Fecha', fmtDate(r.date)],
        ['Proyecto', r.project],
        ['Autor', r.author],
        ['Etiquetas', r.tags.join(', ')],
        ['Notas', r.notes],
        ['Archivo', r.fileName + ' (' + fmtSize(r.fileSize) + ')'],
      ].filter(([, v]) => v);

      $('detail-fields').replaceChildren(
        ...rows.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])
      );

      $('d-open').hidden = !previewable(r.fileType);
      detail.showModal();
    }

    async function fileUrl(r) {
      const stored = await dbGetFile(r.id);
      if (!stored) throw new Error('Archivo no encontrado');
      return URL.createObjectURL(new Blob([stored], { type: r.fileType }));
    }

    $('d-open').addEventListener('click', async () => {
      const r = reports.find((x) => x.id === currentId);
      if (!r) return;
      try {
        const url = await fileUrl(r);
        window.open(url, '_blank', 'noopener');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (err) {
        console.error(err);
        alert('No se pudo abrir el archivo.');
      }
    });

    $('d-download').addEventListener('click', async () => {
      const r = reports.find((x) => x.id === currentId);
      if (!r) return;
      try {
        const url = await fileUrl(r);
        const a = el('a', { href: url, download: r.fileName });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        console.error(err);
        alert('No se pudo descargar el archivo.');
      }
    });

    $('d-delete').addEventListener('click', async () => {
      const r = reports.find((x) => x.id === currentId);
      if (!r) return;
      if (!confirm('¿Eliminar «' + r.title + '»? Esta acción no se puede deshacer.')) return;
      try {
        await dbDelete(r.id);
        reports = reports.filter((x) => x.id !== r.id);
        detail.close();
        refreshProjects();
        render();
      } catch (err) {
        console.error(err);
        alert('No se pudo eliminar el informe.');
      }
    });

    $('d-close').addEventListener('click', () => detail.close());
    detail.addEventListener('click', (e) => {
      if (e.target === detail) detail.close();
    });
    detail.addEventListener('close', () => {
      currentId = null;
    });

    /* ---------- Inicio ---------- */

    async function init() {
      fillTypeSelects();
      dateInput.value = todayISO();
      resetDrop();

      try {
        db = await openDB();
        reports = await dbGetAllReports();
      } catch (err) {
        console.error(err);
        const fatal = $('fatal');
        fatal.hidden = false;
        fatal.textContent =
          'Este navegador no permite guardar informes (por ejemplo, en una ventana privada). Abre la página en una ventana normal.';
        saveBtn.disabled = true;
        return;
      }

      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      refreshProjects();
      render();
    }

    init();
  </script>
</body>
</html>
